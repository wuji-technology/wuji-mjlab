name: Docs Follow-up Callback

# Self-hosted variant — all logic inline, no reusable workflow / App token.
#
# Closes the docs follow-up loop: when the maintainer comments `/docs-done` or
# `/docs-skip` on a PR tagged `docs:followup`, this workflow clears the label,
# posts a confirmation, and sends a final Feishu DM.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  finish:
    if: >-
      github.event.issue.pull_request != null
      && contains(github.event.issue.labels.*.name, 'docs:followup')
      && github.event.comment.user.login == vars.DOCS_MAINTAINER
      && (startsWith(github.event.comment.body, '/docs-done')
          || startsWith(github.event.comment.body, '/docs-skip'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 单卡模型：/docs-done 发出的 done 卡是维护者收到的唯一跟进记录，必须带文档
      # PR 链接。先解析、缺了就在清 label 之前拒绝，避免挂账被清掉却没留下链接。
      - name: Parse command
        id: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT_BODY" == /docs-skip* ]]; then
            VERDICT=skip
            REST="${COMMENT_BODY#/docs-skip}"
            DOCS_PR_URL=""
          else
            VERDICT=done
            REST="${COMMENT_BODY#/docs-done}"
            DOCS_PR_URL="$(grep -oE 'https://github\.com/[^/[:space:]]+/[^/[:space:]]+/pull/[0-9]+' <<<"$REST" | head -1 || true)"
            if [[ -z "$DOCS_PR_URL" ]]; then
              gh pr comment "$PR_NUMBER" -R "$REPO" \
                --body "⚠️ \`/docs-done\` 需要跟上文档 PR 链接（如 \`/docs-done https://github.com/owner/repo/pull/N\`），本次未收尾，\`docs:followup\` 标签保留。"
              echo "::error title=Missing docs PR link::/docs-done requires a GitHub PR URL"
              exit 1
            fi
            # 链接本身不进结论行，结论只留链接之外的备注
            REST="${REST//"$DOCS_PR_URL"/}"
          fi
          DETAIL="$(printf '%s' "$REST" | sed -E 's/^[[:space:]]*[-—:][[:space:]]*//; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          # 随机分隔符：DETAIL 来自评论正文，固定 EOF 会被正文里的 EOF 行提前截断，
          # 甚至被后续行覆盖 docs_pr_url（GitHub 官方建议）
          DELIM="detail_$(openssl rand -hex 16)"
          {
            echo "verdict=$VERDICT"
            echo "docs_pr_url=$DOCS_PR_URL"
            echo "detail<<$DELIM"
            echo "$DETAIL"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Clear label and confirm on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DOCS_PR_URL: ${{ steps.cmd.outputs.docs_pr_url }}
        run: |
          # Tolerate only HTTP 404 (two quick /docs-done comments racing two
          # runs; removing an absent label is a no-op outcome). Anything else
          # must propagate.
          if ! err="$(gh api -X DELETE \
            "repos/$REPO/issues/$PR_NUMBER/labels/docs:followup" \
            2>&1 >/dev/null)"; then
            if ! grep -q "HTTP 404" <<<"$err"; then
              printf '%s\n' "$err" >&2
              exit 1
            fi
          fi
          BODY="✅ 文档跟进已收尾，\`docs:followup\` 标签已清除。"
          if [[ -n "$DOCS_PR_URL" ]]; then
            BODY+=$'\n\n文档 PR：'"$DOCS_PR_URL"
          fi
          gh pr comment "$PR_NUMBER" -R "$REPO" --body "$BODY"

      - name: Feishu DM (callback outcome)
        env:
          FEISHU_DOCS_DM_WEBHOOK: ${{ secrets.FEISHU_DOCS_DM_WEBHOOK }}
          FEISHU_DOCS_DM_SIGN_SECRET: ${{ secrets.FEISHU_DOCS_DM_SIGN_SECRET }}
          PR_NUMBER: ${{ github.event.issue.number }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_AUTHOR: ${{ github.event.issue.user.login }}
          VERDICT: ${{ steps.cmd.outputs.verdict }}
          DOCS_PR_URL: ${{ steps.cmd.outputs.docs_pr_url }}
          DETAIL: ${{ steps.cmd.outputs.detail }}
        run: |
          STATUS=done
          [[ "$VERDICT" == "skip" ]] && STATUS=skipped
          bash .github/scripts/docs-followup/feishu-dm.sh \
            --pr "$PR_NUMBER" \
            --status "$STATUS" \
            --pr-title "$PR_TITLE" \
            --pr-author "$PR_AUTHOR" \
            --docs-pr-url "$DOCS_PR_URL" \
            --detail "$DETAIL"
