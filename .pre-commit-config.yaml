exclude: ^pixi\.lock$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # deploy/reorient/config/cube_calibration.yaml uses !!python/tuple tags
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
        # Preserve the task documentation GIFs.
        exclude: ^src/wuji_mjlab/tasks/(reorient|pen_spin)/docs/assets/.*\.gif$
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      # ruff / ruff-format scope matches pyproject [tool.ruff] src = ["src/wuji_mjlab"]
      # and CI workflow scope. deploy/ and scripts/ are intentionally out of scope.
      - id: ruff
        args: [--fix]
        files: ^src/wuji_mjlab/.*\.py$
      - id: ruff-format
        files: ^src/wuji_mjlab/.*\.py$

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args:
          - '--skip=*.lock,*.svg,*.gif,**/docs/**/*.svg'
          # whis: matplotlib boxplot kwarg; unparseable: valid English variant
          - '--ignore-words-list=whis,unparseable'
