# Revo3 right-hand deployment profile.
#
# policy_joint_order is the trained ONNX/action-manager order used by
# wuji-mjlab Revo3 tasks. sdk_joint_order is the bc-stark-sdk motor order.

robot: revo3
hand: right
default_rate_hz: 20.0

sdk:
  package: bc-stark-sdk
  protocol: modbus
  baudrate: 5000000
  slave_id: 126
  auto_detect: true

mit:
  kp: 1.0
  kd: 0.1
  effort_ma: 0.0

# Transform physical vision wrist-tag poses into the policy tag frame.
# Identity is intentionally marked uncalibrated: dry-run/shadow may proceed,
# but active mode must refuse until this is measured for the Revo3 fixture.
# vision_to_policy_frame:
#   calibrated: false
#   position_xyz: [0.0, 0.0, 0.0]
#   quat_wxyz: [1.0, 0.0, 0.0, 0.0]
vision_to_policy_frame:
  calibrated: false
  position_xyz: [-0.09483, 0.0, 0.01422]
  quat_wxyz: [1.0, 0.0, 0.0, 0.0]

sim2real_joint_offset:
  order: sdk_joint_order
  values:
    - 0.0
    - 0.0
    - 0.3
    - 0.3
    - 0.0
    - 0.0
    - 0.3
    - 0.3
    - 0.0
    - 0.0
    - 0.3
    - 0.3
    - 0.0
    - 0.0
    - 0.3
    - 0.3
    - 0.0
    - 0.3
    - 0.3
    - 0.0
    - -0.2

policy_joint_order:
  - right_thumb_CMP_joint
  - right_thumb_CMR_joint
  - right_thumb_MCP_joint
  - right_thumb_PIP_joint
  - right_thumb_DIP_joint
  - right_index_MPR_joint
  - right_index_MCP_joint
  - right_index_PIP_joint
  - right_index_DIP_joint
  - right_middle_MPR_joint
  - right_middle_MCP_joint
  - right_middle_PIP_joint
  - right_middle_DIP_joint
  - right_ring_MPR_joint
  - right_ring_MCP_joint
  - right_ring_PIP_joint
  - right_ring_DIP_joint
  - right_little_MPR_joint
  - right_little_MCP_joint
  - right_little_PIP_joint
  - right_little_DIP_joint

sdk_joint_order:
